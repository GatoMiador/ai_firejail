[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_firejail"
version = "0.1.0"
description = "Wrapper GTK4 para o firejail voltado à execução de algoritmos de IA em sandbox."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
# PyGObject/GTK4/libadwaita são dependências de sistema (python3-gi,
# gir1.2-gtk-4.0, gir1.2-adw-1) e não são instaladas via pip.
dependencies = []

[project.scripts]
ai-firejail = "ai_firejail.application:main"

[tool.setuptools]
packages = ["ai_firejail"]
